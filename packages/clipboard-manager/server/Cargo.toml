[package]
name = "clipboard-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "clipboard-server"
path = "src/main.rs"

[dependencies]
anyhow          = "1"
chrono          = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs            = "7"
fs2             = "0.4"
image           = "0.25"
notify          = "8"
resvg           = "0.48"
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
tokio           = { version = "1", features = ["full"] }
uuid            = { version = "1", features = ["v4"] }
wl-clipboard-rs = "0.9"
zbus            = { version = "5", features = ["tokio"] }
