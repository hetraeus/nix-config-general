[package]
name = "clipboard-client"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.14", default-features = false, features = [
    "wayland",
    "image",
    "svg",
    "tokio",
    "advanced",
    "wgpu",
] }
wl-clipboard-rs = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zbus = { version = "5.17", features = ["tokio"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "fs", "sync", "macros"] }
futures = "0.3.34"
dirs = "6.0"
log = "0.4.34"
env_logger = "0.11.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Defer major upgrade
notify = "7.0"
iced_exwlshell = "0.20.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
